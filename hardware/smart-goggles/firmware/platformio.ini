; ============================================================================
; Diya Smart Goggle Firmware
; Hardware: ESP32-S3-N16R8 (16MB Flash, 8MB PSRAM, OPI PSRAM interface)
;
; IMPORTANT: This project targets EXACTLY one hardware family.
;   board = 4d_systems_esp32s3_gen4_r8n16
;
; Why this board definition?
;   - The stock "esp32-s3-devkitc-1" maps to the N8 variant (no PSRAM).
;     PlatformIO reports "No PSRAM" and the camera framebuffer malloc fails.
;   - The N16R8 uses an OPI (Octal-SPI) PSRAM interface, not the standard
;     QIO PSRAM. The memory_type must be "qio_opi" or the PSRAM controller
;     is never initialized and psramFound() returns false.
;   - "4d_systems_esp32s3_gen4_r8n16" ships with:
;       memory_type = qio_opi
;       -DBOARD_HAS_PSRAM
;       16MB flash layout
;     which is a correct match for ESP32-S3-N16R8.
;
; If PSRAM is still not detected after flashing:
;   1. Verify board selection in PlatformIO (not Arduino IDE)
;   2. Run full erase: esptool.py --chip esp32s3 erase_flash
;   3. Re-flash clean
; ============================================================================

[env:esp32-s3-n16r8]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino

; ── PSRAM: OPI interface required for N16R8 ─────────────────────────────────
; qio_opi = QIO Flash + OPI PSRAM (correct for ESP32-S3-N16R8)
; Without this the PSRAM controller is NOT initialized and psramFound()=false
board_build.arduino.memory_type = qio_opi

; ── Flash layout for 16MB ───────────────────────────────────────────────────
board_build.partitions = default_16MB.csv
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; ── Serial Monitor ──────────────────────────────────────────────────────────
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ── Build flags ─────────────────────────────────────────────────────────────
build_flags = 
    -DCORE_DEBUG_LEVEL=4
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; NOTE: -mfix-esp32-psram-cache-issue is for older ESP32 (not S3).
    ; Removed to avoid incorrect cache workaround on S3 silicon.

; ── Libraries ───────────────────────────────────────────────────────────────
; esp32-camera: pinned to known-good version for S3 + OV2640/OV5640
lib_deps = 
    ArduinoJson@^7.0.0
    espressif/esp32-camera@^2.0.13
    mathieucarbou/AsyncTCP@^3.3.2
    mathieucarbou/ESPAsyncWebServer@^3.6.0

; ── Upload settings ─────────────────────────────────────────────────────────
upload_speed = 921600
upload_port = COM3  ; Change to match your system (e.g. COM4, /dev/ttyUSB0)